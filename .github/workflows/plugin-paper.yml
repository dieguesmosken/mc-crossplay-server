# CI do plugin Paper (issue #25, etapa 4). Roda em qualquer PR que mexa em apps/plugin-paper,
# independente da branch base (o workflow legado só roda em PR para main).
name: Plugin Paper

on:
  pull_request:
    paths:
      - 'apps/plugin-paper/**'
      - '.github/workflows/plugin-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/plugin-paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Gradle 9.1+ é o primeiro a rodar em Java 25.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: 'Núcleo (sem dependências) - compila e roda os testes'
        run: gradle :core:check
      - name: 'Adaptador Paper (precisa do paper-api) - compila e gera o jar'
        run: gradle :paper:build
      - uses: actions/upload-artifact@v4
        with:
          name: mc-platform-plugin
          path: apps/plugin-paper/paper/build/libs/*.jar
          if-no-files-found: error

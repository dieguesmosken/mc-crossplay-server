# docker-compose.yml para o runtime Minecraft (Paper + GeyserMC + Floodgate)
# Ambiente local-first; preserva mundo, plugins e configs em um único volume persistente.
#
# Persistência: ./data (host) → /server/data (container), que é o diretório de trabalho
# do Paper. Tudo que o servidor gera fica ali: world*, plugins/, config/, logs/,
# server.properties, whitelist.json, ops.json, bukkit.yml, spigot.yml e eula.txt.
# O /server/paper.jar fica na imagem e nunca é coberto por volume.
#
# Antes do primeiro uso, rode: ./scripts/init-data.sh (cria ./data com o seu usuário).
#
# Variáveis opcionais (veja .env.example):
#   MC_MEMORY_LIMIT  limite de memória do container. Padrão: 3g.
#   MC_JAVA_HEAP     heap da JVM. Padrão: 2G (precisa ficar abaixo do limite do container).
#   MC_JAVA_OPTS     flags extras da JVM.
#   MC_BIND_ADDRESS  endereço do host em que as portas são publicadas. Padrão: 127.0.0.1
#                    (só este computador). Para testar na rede local use o IP da LAN do
#                    computador ou 0.0.0.0. ATENÇÃO: o Docker ignora o ufw; qualquer valor
#                    diferente de 127.0.0.1 abre as portas para a LAN (veja o README).

services:
  papermc:
    # Construção baseada no Dockerfile abaixo
    build:
      context: ./minecraft
      dockerfile: Dockerfile
    container_name: minecraft-paper
    working_dir: /server
    # Sem restart automático: o início/parada é decisão do usuário/Controller.
    # Com "unless-stopped", a saída com código 1 por EULA não aceita viraria loop infinito.
    restart: "no"
    mem_limit: ${MC_MEMORY_LIMIT:-3g}
    environment:
      MC_JAVA_HEAP: ${MC_JAVA_HEAP:-2G}
      MC_JAVA_OPTS: ${MC_JAVA_OPTS:-}
    # Portas publicadas em MC_BIND_ADDRESS (padrão: loopback, uso local).
    # Java usa TCP (25565). Bedrock usa UDP (19132) e, com NetherNet (Bedrock 26.60+),
    # também TCP 19132 para a sinalização (issue #23).
    ports:
      - "${MC_BIND_ADDRESS:-127.0.0.1}:25565:25565/tcp"
      - "${MC_BIND_ADDRESS:-127.0.0.1}:19132:19132/udp"
      - "${MC_BIND_ADDRESS:-127.0.0.1}:19132:19132/tcp"
    volumes:
      # Único volume persistente: mundo, plugins, configs, logs e EULA.
      - ./data:/server/data
    networks:
      - minecraft_net

networks:
  minecraft_net:
    driver: bridge
